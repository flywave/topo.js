<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>go-cadgen 编辑器</title>
  <style>
    :root { --line: #2a2a2a; --bg: #141414; --panel: #1c1c1c; --fg: #d8d8d8; --accent: #4f9cf9; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg);
           display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    header input[type=text] { flex: 0 1 320px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 4px 8px; border-radius: 4px; }
    header button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    header button:disabled { opacity: .5; cursor: default; }
    main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
    #viewport { position: relative; min-width: 0; }
    #panels { border-left: 1px solid var(--line); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 12px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
    .panel h3 { margin: 0 0 6px; font-size: 12px; color: var(--accent); }
    .panel-section-title { margin: 8px 0 4px; font-weight: 600; color: var(--accent); }
    .panel-row { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
    .panel-row label { flex: 0 0 auto; }
    .panel-row input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px 6px; border-radius: 3px; }
    .panel button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px; cursor: pointer; }
    .chat-feed { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .chat-line { padding: 2px 6px; border-radius: 3px; background: var(--bg); white-space: pre-wrap; word-break: break-all; }
    .chat-user { border-left: 3px solid var(--accent); }
    .chat-warning { border-left: 3px solid #e0a13c; color: #e0a13c; }
    .chat-done { border-left: 3px solid #58b368; color: #58b368; }
    .chat-reasoning { color: #9a9a9a; }
    /* 流式阶段卡片 (迭代 37): 一个阶段一张卡, 干净完成即折叠, 有警告保持展开 */
    .stream-card { background: var(--bg); border: 1px solid var(--line); border-left-width: 3px; border-radius: 3px; padding: 2px 6px; }
    .stream-active { border-left-color: var(--accent); }
    .stream-done { border-left-color: #58b368; opacity: .82; }
    .stream-warned { border-left-color: #e0a13c; }
    .stream-head { font-size: 12px; color: var(--fg); user-select: none; }
    .stream-active .stream-head { color: var(--accent); }
    .stream-line { font-size: 12px; color: #9a9a9a; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
    .stream-line.stream-warn { color: #e0a13c; }
    .stream-line.stream-round { color: #b08fd8; }
    /* 特征树 (迭代 38): op 徽标 + hover 预览 + 选中行; 权威失败横幅 */
    .ft-row { margin: 1px 0; padding: 1px 4px; border-radius: 3px; }
    .ft-row:hover { background: #24303f; }
    .ft-row.ft-selected { background: #1d2c3f; color: #4f9cf9; }
    .ft-op-badge { flex: 0 0 auto; font-size: 11px; background: #22303f; color: #8fb8e8;
                   border-radius: 3px; padding: 0 5px; }
    .ft-banner { display: flex; gap: 6px; align-items: center; margin-bottom: 6px;
                 padding: 4px 8px; border-radius: 4px; font-size: 12px; word-break: break-all; }
    .ft-banner.ft-error { background: #3a2020; border: 1px solid #a04848; color: #e8a0a0; }
    .ft-banner.ft-warn { background: #383020; border: 1px solid #a08848; color: #e0c890; }
    .ft-banner button { margin-left: auto; }
    /* 版本历史 (迭代 39): 时间线行 + 当前版本标记 */
    .ver-row { margin: 1px 0; padding: 1px 4px; border-radius: 3px; }
    .ver-row.ver-current { background: #1d2c3f; color: #4f9cf9; }
    .ver-row span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ver-hint { font-size: 11px; color: #777; margin-top: 4px; }
    /* 选中上下文 chip (迭代 40): 下一回合将携带的选中, 发送前可见 */
    .chat-ctx-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .chat-ctx-chip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                     font-size: 12px; background: #1d2c3f; color: #8fb8e8; border: 1px solid #2c4460;
                     border-radius: 10px; padding: 1px 8px; }
    .chat-ctx-chip.chat-ctx-local { color: #9a9a9a; background: var(--bg); border-color: var(--line); }
    .chat-ctx-row button { flex: 0 0 auto; }
    /* toast (迭代 40): 视口上方短暂横陈的关键事件 */
    #toasts { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
              display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    .toast { pointer-events: auto; cursor: pointer; max-width: 70vw; padding: 6px 14px; border-radius: 6px;
             font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.45); word-break: break-all; }
    .toast-error { background: #3a2020; border: 1px solid #a04848; color: #e8a0a0; }
    .toast-warn { background: #383020; border: 1px solid #a08848; color: #e0c890; }
    .toast-done { background: #1e3024; border: 1px solid #4a8a5c; color: #9fd8ae; }
    .export-warn { color: #e0a13c; font-size: 12px; margin-top: 4px; }
    textarea { width: 100%; min-height: 56px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; resize: vertical; }
    #log { position: absolute; left: 0; right: 0; bottom: 0; max-height: 30%; overflow-y: auto; padding: 4px 10px;
           font: 11px/1.6 ui-monospace, monospace; color: #9a9a9a; pointer-events: none; text-shadow: 0 1px 2px #000; }
    #log .done { color: #58b368; } #log .warning { color: #e0a13c; }
    .export-row { display: flex; gap: 6px; }
    .export-link { flex: 1; text-align: center; background: var(--bg); color: var(--accent); border: 1px solid var(--line);
                   padding: 4px 8px; border-radius: 3px; text-decoration: none; font-size: 12px; }
    .export-link:hover { border-color: var(--accent); }
    .assembly-actions { display: flex; gap: 6px; margin-top: 6px; }
    .assembly-actions button { flex: 1; }
    .creation-row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
    .creation-preview { width: 100%; max-height: 120px; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; }
    .creation-mode { color: #9a9a9a; }
    .creation-mode.dual { color: var(--accent); }
    .chat-input-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .chat-image-mark { color: var(--accent); font-size: 12px; cursor: pointer; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <strong>go-cadgen</strong>
    <input id="runId" type="text" placeholder="run id（或从 URL ?run=）" />
    <button id="load">加载</button>
    <button id="undo" title="撤销 (Ctrl+Z)">撤销</button>
    <button id="redo" title="重做 (Ctrl+Shift+Z)">重做</button>
    <span id="status"></span>
  </header>
  <main>
    <div id="viewport">
      <div id="panels-host" style="position:absolute; right:0; top:0; display:none"></div>
      <div id="log"></div>
    </div>
    <div id="panels"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
